<title>Lot Tag Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Barlow:wght@400;600;800&family=Lato:wght@400&display=swap">
<style>
:root{--bg:#111013;--panel:#1b1a1f;--ink:#f3f0ea;--muted:#a7a2ad;--line:#322f38;--accent:#a66bff;--spray:#8ce35f;--spray-ink:#0d1209;--bad:#ff7066;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lock{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:14px;position:relative;isolation:isolate}
.lock::before{content:"";position:absolute;z-index:-1;inset:-60px auto auto -60px;width:220px;height:140px;border-radius:50%;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.35;filter:blur(20px)}
small{font-size:12px;font-weight:800;color:var(--spray);letter-spacing:.16em;text-transform:uppercase}
h1{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;font-size:40px;line-height:1;margin:0;text-transform:uppercase}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600;display:grid;gap:6px}
input{font:inherit;font-family:Lato,Arial,sans-serif;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--spray);outline-offset:2px}
button{font:inherit;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:12px 18px;cursor:pointer;border:0;background:var(--spray);color:var(--spray-ink)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
</style>
</head>
<body>
<form class="lock" id="f" autocomplete="off">
  <div><small>Inventory sorting</small><h1>Lot Tag Desk</h1></div>
  <p>Enter the passcode to open the tool.</p>
  <label for="pc">Passcode<input id="pc" type="password" autocomplete="current-password" required autofocus></label>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Unlock</button>
</form>
